repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      # Temporary formatter debt (4 files); remove paths as focused PRs land.
      - id: ruff-format
        exclude: |
          (?x)^(
            cronenberg/cli/__init__\.py|
            cronenberg/cli/tools\.py|
            cronenberg/tests/test_cli\.py|
            cronenberg/tests/test_cli_tools\.py
          )$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
