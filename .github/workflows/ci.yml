name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Validate uv lockfile
        run: uv lock --check

      - name: Sync dependencies from uv.lock
        run: uv sync --locked --all-extras --dev

      # Keep the 153 existing findings visible as annotations without blocking CI.
      - name: Ruff baseline (non-blocking; 153 legacy findings)
        continue-on-error: true
        run: uv run --locked ruff check --output-format=github .

      - name: Run pytest (blocking)
        run: uv run --locked pytest
