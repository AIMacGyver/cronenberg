[project]
name = "cronenberg"
version = "6.0.1"
description = "Code Metrics in Python"
authors = [
    { name = "Michele Lacchia", email = "michelelacchia@gmail.com" },
]
maintainers = [
    { name = "Rob Annand" },
]
license = "MIT"
readme = "README.rst"
requires-python = ">=3.11"
dependencies = [
    "colorama>=0.4.1",
    "mando>=0.6,<0.8",
]
keywords = ["static analysis", "code complexity", "metrics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]

[project.optional-dependencies]
toml = ["tomli>=2.0.1"]

[project.scripts]
cronenberg = "radon:main"

[project.entry-points."flake8.extension"]
R70 = "radon.contrib.flake8:Flake8Checker"

[project.entry-points."setuptools.installation"]
eggsecutable = "radon:main"

[project.urls]
Documentation = "https://radon.readthedocs.org/"
Source = "https://github.com/rubik/radon"

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-mock",
    "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["radon/tests"]

[tool.hatch.build.targets.wheel]
packages = ["radon"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
